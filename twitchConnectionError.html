<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация Twitch</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0e0e10;
            color: #efeff1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1f1f23;
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid #d12e44;
            animation: fadeIn 0.6s ease-out;
        }
        .icon-container {
            width: 72px;
            height: 72px;
            background: #d12e44;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
            box-shadow: 0 0 20px rgba(255, 0, 10, 0.5);
        }
        .icon {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }
        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }
        p {
            color: #adadb8;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }
        .status-badge {
            display: inline-block;
            background-color: rgba(245, 0, 5, 0.15);
            color: #f50525;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-container">
        <!-- Минималистичная иконка крестика -->
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
        </svg>
    </div>

    <h1>Angel`s Dreams не удалось подключиться.</h1>
    <p>Попробуйте еще раз.</p>

    <div class="status-badge">Соединение не установлено</div>
</div>

</body>
</html>
